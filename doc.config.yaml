release_name: Tier 5 SOTA Neural Pipelines & Zero-Shot Voice Cloning
license: Apache-2.0
platform: Android ARM64 / Qualcomm Adreno & ARM Mali Vulkan 1.3 / Linux
github_repo_url: https://github.com/uno-km/termux-tts
custom_pages:
- slug: vulkan-engineering-paper
  title_en: Vulkan C++ Engineering Paper
  title_ko: Vulkan C++ 네이티브 가속 논문
  file: lib/tts/vulkan-engineering-paper.html
tagline_en: Production-Grade 4-Tier On-Device Speech Synthesis Framework (Multilingual Neural Orchestrator, Zero-Dependency DSP Formant & C++ Acceleration)
tagline_ko: 모바일 및 엣지 환경을 위한 프로덕션급 4-Tier 온디바이스 음성 합성 프레임워크 (다국어 신경망 오케스트레이터, 무의존성 DSP 포먼트, C++ 가속 엔진)
why_challenge_en: Constrained mobile edge environments frequently suffer from execution instability, excessive thermal throttling, and unpredictable runtime memory spikes when running conventional deep learning text-to-speech stacks. Heavyweight dependencies like full PyTorch or unoptimized runtime graph compilers exhaust mobile DRAM, while cross-language code-switching historically required multiple disconnected runtimes or heavy cloud APIs.
why_challenge_ko: 제약된 모바일 엣지 환경에서는 과도한 메모리 점유, 발열 스로틀링, 드라이버 파편화로 인해 생성형 음성 합성 모델 구동이 불안정합니다. 기존 무거운 프레임워크는 수 기가바이트의 런타임 의존성으로 모바일 OOM을 유발하며, 다국어 교차 발화(한/영/일 등)는 단일 기기 로컬에서 매끄럽게 처리하기 어려웠습니다.
description_en: Termux-TTS delivers a resilient 4-Tier on-device text-to-speech architecture designed for deterministic latency, zero-config ergonomics, and multi-language acoustic fidelity. It bridges lightweight parametric DSP synthesis (<50ms compute, 0MB model download) with high-fidelity resident C-API multilingual neural models (9 languages including Korean, English, Japanese, Hindi, and Russian at 22.05kHz), alongside Android system native speech service routing. With automated 1-click provisioning, Unicode script classification, and resident in-memory model caching, Termux-TTS achieves high acoustic fidelity with sub-0.18x real-time factor.
description_ko: Termux-TTS는 결정론적 지연 시간, Zero-Config 사용성, 다국어 고품질 음향을 실현하는 프로덕션급 4-Tier 온디바이스 음성 합성 프레임워크입니다. 0MB 무의존성 파라메트릭 DSP 보코더부터 9개 공식 언어(한국어, 영어, 일본어, 힌디어, 러시아어 등)를 지원하는 레지던트 C-API 다국어 신경망 오케스트레이터, 그리고 안드로이드 네이티브 음성 브릿지까지 통합 제공합니다.
quick_install_cmd: 'pip install termux-tts

  # or: npm install termux-tts

  # 1-Click Provision Default Models (Korean KSS + English Lessac):

  termux-tts install

  # On-demand provision specific languages (e.g. Hindi, Japanese, Russian, or all):

  termux-tts install --models hi

  # Instant speech synthesis:

  termux-tts "Hello 방가방가 나는 parrot 이라고 해." -o out.wav --play

  '
features:
- title_en: Tier 5 SOTA Speech Synthesis & Voice Cloning
  title_ko: Tier 5 SOTA 신경망 음성 합성 및 제로샷 보이스 클로닝
  desc_en: Native ONNX execution for CosyVoice 2, F5-TTS, and ChatTTS INT8 supporting zero-shot voice cloning and expressive prosody.
  desc_ko: CosyVoice 2, F5-TTS, ChatTTS INT8 ONNX 네이티브 파이프라인을 통해 제로샷 음성 복제와 자연스러운 대화형 억양 합성을 지원합니다.
- title_en: Multilingual Neural Orchestrator
  desc_en: Dynamic cross-language code-switching and single-language synthesis supporting 9 official languages (Korean, English, Japanese, Chinese, Hindi, Russian, Spanish, French, German) with 50ms context-aware pause padding.
  title_ko: 다국어 신경망 오케스트레이터
  desc_ko: 한국어, 영어, 일본어, 중국어, 힌디어, 러시아어, 스페인어, 프랑스어, 독일어 9대 언어의 다국어 교차 발화 및 단독 발화를 50ms 문맥 묵음 패딩과 함께 실시간 합성합니다.
- title_en: Resident C-API In-Memory Acceleration
  desc_en: Native C-API residency with SherpaResidentManager eliminates subprocess startup latency and achieves sub-0.18x real-time factor with ARM NEON SIMD acceleration.
  title_ko: 레지던트 C-API 인메모리 가속
  desc_ko: SherpaResidentManager를 통한 C-API 모델 인메모리 상주로 프로세스 기동 지연을 전면 배제하고 ARM NEON SIMD 가속으로 0.18x 이하의 RTF를 달성합니다.
- title_en: Zero-Config CLI Ergonomics
  desc_en: Top-level speech synthesis by default (termux-tts 'Hello' --play) without requiring subcommands or explicit engine flags. Explicit 'speak' command routes to Android native system voice.
  title_ko: Zero-Config CLI 사용성
  desc_ko: 서브 커맨드나 엔진 플래그 없이 문장을 직접 입력(termux-tts '문장' --play)하면 즉시 신경망 합성이 수행되며, 안드로이드 시스템 음성은 'speak'로 명시 분기합니다.
- title_en: On-Demand Self-Healing Provisioner
  desc_en: 1-Click automated provisioning (termux-tts install --models default/hi/ja/ru/zh/all) with actionable English guidance and absolute paths for uninstalled models.
  title_ko: 온디맨드 자가 치유 프로비저너
  desc_ko: 최초 설치 시 기본 모델(한/영)만 경량 배포하고, 미설치 언어 호출 시 절대 경로와 함께 즉시 복구 가능한 영문 안내문 및 온디맨드 설치 명령을 제공합니다.
- title_en: 4-Tier Resilient Architecture
  desc_en: 'Tier 1: Zero-Dependency Parametric DSP Formant (0MB footprint). Tier 2: Android Native System Voice Bridge. Tier 3: Subprocess-Isolated Sherpa C++ CPU Engine. Tier 4: Pure Vulkan GPU Hardware Neural Acceleration.'
  title_ko: 4-Tier 복원형 합성 아키텍처
  desc_ko: Tier 1 무의존성 DSP 포먼트, Tier 2 안드로이드 네이티브 음성 브릿지, Tier 3 격리형 Sherpa CPU 엔진, Tier 4 순수 Vulkan GPU 하드웨어 신경망 가속.
- title_en: 1-Click Automated Provisioning
  desc_en: Command-line provisioning (termux-tts install --tier high/medium) automatically resolves precompiled ARM64 native binaries and HuggingFace weights with self-test verification.
  title_ko: 1-클릭 자동 프로비저닝
  desc_ko: 명령어 1회로 ARM64 네이티브 바이너리와 허깅페이스 가중치를 자동 감지 및 설치하고 자체 진단 테스트를 완결합니다.
- title_en: Studio-Grade FP16 Neural Fidelity
  desc_en: Native support for high-resolution 22.05kHz 16-bit PCM studio models (vits-piper-en_US-lessac-high-fp16), delivering natural prosody on mobile hardware.
  title_ko: 스튜디오급 FP16 고음질 신경망
  desc_ko: 22.05kHz 16비트 PCM 고해상도 레퍼런스 모델을 지원하여 극도로 자연스러운 억양과 음향 충실도를 모바일 단말기에서 제공합니다.
- title_en: Pure Vulkan GPU Acceleration (Zero CPU Fallback)
  desc_en: Direct GPU tensor compute via Vulkan 1.3 pipeline caching, fully resolving Qualcomm Adreno 830 and ARM Mali-G68 shader driver anomalies without silent CPU fallback.
  title_ko: 순수 Vulkan GPU 가속 (Zero CPU 침묵 폴백)
  desc_ko: 침묵 폴백 없이 Qualcomm Adreno 830 및 ARM Mali-G68의 셰이더 드라이버 결함을 완전 해소하고 순수 GPU 텐서 연산을 수행합니다.
- title_en: Subprocess IPC Memory Isolation
  desc_en: Architectural separation of audio synthesis and OpenSL ES playback threads via subprocess IPC prevents Python GIL contention and memory corruption.
  title_ko: 프로세스 격리형 메모리 보호
  desc_ko: 음성 합성 파이프라인과 오디오 재생 스레드를 서브프로세스 IPC로 분리하여 GIL 병목 및 메모리 오염을 원천 차단합니다.
- title_en: Unified Cross-Language Toolchain
  desc_en: Identical functional parity and strict typing across Global CLI, Python 3.10+ SDK, and Node.js / TypeScript runtime bindings.
  title_ko: 통합 크로스 랭귀지 툴체인
  desc_ko: Global CLI, Python 3.10+ SDK, Node.js / TypeScript 런타임 간 완전한 기능 동등성과 타입 안전성을 보장합니다.
matrix_table:
- category: 'Tier 1: DSP Formant'
  operations: Rosenberg Glottal Pulse, 5-Band Biquad Filter, Sino-Korean Numeral Normalizer
  status: Production (<50ms)
- category: 'Tier 2: Native Bridge'
  operations: Termux-API / Android TTS Service IPC (Samsung/Google Engine)
  status: Production (Immediate)
- category: 'Tier 3: CPU Neural'
  operations: Sherpa C++ Subprocess-Isolated VITS Engine (ARM64 NEON)
  status: Production (RTF 0.4~1.2x)
- category: 'Tier 4: Vulkan GPU'
  operations: C++ Vulkan Pipeline Caching, Mali Quirk Handling, Adreno Subgroup 64
  status: Production (RTF 0.26x)
code_example_py: "import termux_tts as tts\n\n# 1. Zero-Config Multilingual Neural Synthesis (Korean + English Code-Switching)\nwith tts.load() as engine:\n    result = engine.synthesize(\n        \"Hello 방가방가 키키키키 나는 parrot 이라고 해. Natural cross-language neural voice.\",\n        output=\"multilingual.wav\"\n    )\n    print(f\"Synthesized {result.duration_sec:.2f}s in {result.elapsed_ms:.1f}ms (RTF: {result.rtf:.4f}x)\")\n\n# 2. Pure Vulkan GPU Neural Synthesis (Studio Tier)\nwith tts.load(engine=\"vulkan\", model_tier=\"high\") as engine:\n    result = engine.synthesize(\n        \"The neural speech synthesis engine is operating with pure Vulkan hardware acceleration.\",\n        output=\"studio_vulkan.wav\"\n    )\n    print(f\"Synthesized {result.duration_sec:.2f}s in {result.elapsed_ms:.1f}ms (RTF: {result.rtf:.4f}x)\")\n\n# 3. Instant Zero-Dependency DSP Formant Synthesis\nwith tts.load(engine=\"dsp\", preset=\"balanced\") as engine:\n    result = engine.synthesize(\"Instant speech\
  \ generation with zero external weights.\", output=\"dsp.wav\")\n    print(f\"DSP Synthesis Latency: {result.elapsed_ms:.1f}ms\")\n\n# 4. Direct Android Hardware Speaker Playback\nwith tts.load(engine=\"native\", language=\"en\") as engine:\n    engine.speak(\"Direct hardware speaker output via Android native service.\")\n"
code_example_js: "const tts = require('termux-tts');\n\nasync function main() {\n  // 1. Initialize Vulkan GPU Neural Engine\n  const engine = tts.load({ engine: 'vulkan', tier: 'high' });\n  const res = await engine.synthesize(\n    \"High-performance speech synthesis on mobile hardware.\",\n    { output: \"vulkan_output.wav\" }\n  );\n  console.log(`Generated: ${res.durationSec}s in ${res.elapsedMs}ms (RTF: ${res.rtf}x)`);\n\n  // 2. Hardware Diagnostics\n  const diag = await tts.doctor();\n  console.log(`Vulkan GPU Device: ${diag.device_name} (API: ${diag.api_version})`);\n}\nmain();\n"
