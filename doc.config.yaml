  \ Galaxy S21</strong><br>Exynos 2100 / ARM Mali-G78</td>\n      <td>Bionic Vulkan GPU</td>\n      <td>Piper VITS (On-chip Tiled)</td>\n      <td>3.12 s</td>\n      <td><strong>0.56 s</strong></td>\n      <td><strong>0.18x</strong></td>\n      <td>5.5x Faster Than RT / Zero Fallback</td>\n    </tr>\n    <tr>\n      <td><strong>Samsung Galaxy S20</strong><br>Exynos 990 / ARM Mali-G77</td>\n      <td>Bionic Vulkan GPU</td>\n      <td>Piper VITS (On-chip Tiled)</td>\n      <td>3.12 s</td>\n      <td><strong>0.75 s</strong></td>\n      <td><strong>0.24x</strong></td>\n      <td>4.1x Faster Than RT / SRAM Tiled</td>\n    </tr>\n    <tr>\n      <td><strong>Samsung Galaxy S25</strong><br>Snapdragon 8 Elite / Adreno 830</td>\n      <td>Bionic Vulkan GPU</td>\n      <td>Supertonic 3 Flow Matching</td>\n      <td>3.12 s</td>\n      <td><strong>0.38 s</strong></td>\n      <td><strong>0.12x</strong></td>\n      <td>Ultra-Fast Studio / Flow Matching</td>\n    </tr>\n    <tr>\n      <td><strong>Samsung\
  \ Galaxy S25</strong><br>Snapdragon 8 Elite / Adreno 830</td>\n      <td>Vulkan GPU Neural</td>\n      <td>lessac-high-fp16 (22.05kHz)</td>\n      <td>6.70 s</td>\n      <td><strong>6.65 s</strong></td>\n      <td><strong>0.993x</strong></td>\n      <td>GPU Subgroup 64 / Pure Tensor</td>\n    </tr>\n    <tr>\n      <td><strong>Samsung Galaxy S25</strong><br>Snapdragon 8 Elite / Adreno 830</td>\n      <td>Vulkan GPU Neural</td>\n      <td>lessac-medium (22.05kHz)</td>\n      <td>4.59 s</td>\n      <td><strong>1.21 s</strong></td>\n      <td><strong>0.264x</strong></td>\n      <td>GPU Compute / 3.79x Faster Than RT</td>\n    </tr>\n    <tr>\n      <td><strong>Samsung Galaxy A35</strong><br>Exynos 1380 / ARM Mali-G68 MP5</td>\n      <td>Vulkan GPU Neural</td>\n      <td>lessac-medium (22.05kHz)</td>\n      <td>4.52 s</td>\n      <td><strong>5.18 s</strong></td>\n      <td><strong>1.146x</strong></td>\n      <td>Mali Subgroup 16 / Medium Kernel</td>\n    </tr>\n    <tr>\n      <td><strong>Samsung\
  \ Galaxy A35</strong><br>Exynos 1380 / ARM Mali-G68 MP5</td>\n      <td>Vulkan GPU Neural</td>\n      <td>lessac-high-fp16 (22.05kHz)</td>\n      <td>6.73 s</td>\n      <td><strong>34.33 s</strong></td>\n      <td><strong>5.098x</strong></td>\n      <td>Full VRAM Resident / High Fidelity</td>\n    </tr>\n    <tr>\n      <td><strong>Heterogeneous ARM64</strong><br>All Core Profiles</td>\n      <td>Parametric DSP Formant</td>\n      <td>5-Band Biquad Formant</td>\n      <td>4.15 s</td>\n      <td><strong>0.054 s</strong></td>\n      <td><strong>0.0130x</strong></td>\n      <td>0MB External RAM / Instant CPU</td>\n    </tr>\n  </tbody>\n</table>\n"
advanced_parameters_body: '<h3>Architecture &amp; Hardware Driver Postmortem</h3>

  <p>Operating deep learning inference models on mobile Vulkan runtimes involves navigating severe GPU driver irregularities. Below is the technical breakdown of bugs identified and permanently resolved in Termux-TTS v1.3.0:</p>


  <h4>1. ARM Mali-G68 Valhall Subgroup Truncation Resolution</h4>

  <p>On ARM Mali-G68 GPUs (subgroup size 16), unaligned matrix multiplication workgroups caused an integer division truncation: <code>loadstride_b = gl_WorkGroupSize.x * LOAD_VEC_B / BK = 16 * 1 / 32 = 0</code>. This resulted in an infinite loop (<code>for (uint l = 0; l &lt; BN; l += 0)</code>) leading to GPU command timeout and device loss (<code>VK_ERROR_DEVICE_LOST</code>). Termux-TTS enforces medium tile alignment and subgroup-aware shader dispatch, eliminating the loop and ensuring full 100% layer execution.</p>


  <h4>2. Qualcomm Adreno 830 SPIR-V Pipeline Caching</h4>

  <p>On Snapdragon 8 Elite Adreno 830 hardware, repeated runtime pipeline generation triggered JIT compiler crashes (<code>VK_ERROR_UNKNOWN -13</code>). Termux-TTS isolates model pipelines with immutable descriptor pooling and shader pipeline caching, stabilizing execution across long synthesis streams.</p>


  <h4>3. Subprocess IPC Architecture for Audio Playback</h4>

  <p>In-process audio playback via native libraries frequently triggered memory corruption and GIL deadlocks on Android Bionic. Termux-TTS orchestrates playback using isolated subprocess worker pools, safeguarding the primary application runtime.</p>

  '
changelog:
- version: v1.7.0
  date: '2026-10-13'
  title: Tier 5 SOTA Neural Pipelines & Zero-Shot Voice Cloning
  type: Production Release (Latest)
  summary_ko: Tier 5 SOTA 신경망 음성 합성 엔진 3종(CosyVoice 2, F5-TTS, ChatTTS INT8 ONNX) 네이티브 파이프라인 신규 통합, 레거시 가짜 사인파 스텁 완전 박멸 및 제로-침묵-폴백 Fail-Fast 강제, 화자 프로필 및 음향 어댑터 CLI 추가.
  summary_en: Integrated Tier 5 SOTA neural speech synthesis pipelines (CosyVoice 2, F5-TTS, ChatTTS INT8 ONNX) with zero-shot voice cloning, purged legacy sinusoidal stubs for strict fail-fast execution, and added acoustic adaptor CLI.
  changes:
  - 'Integrated Tier 5 SOTA ONNX neural synthesis pipelines: CosyVoice 2, F5-TTS, and ChatTTS INT8.'
  - Enabled on-device zero-shot voice cloning and conversational prosody control.
  - Eliminated legacy sinusoidal fallback stubs in favor of strict fail-fast error reporting.
  - Added speaker profile and acoustic adaptor CLI commands.
  - Unified GPU neural vocoder dispatch through ameva-runtime HAL.
- version: v1.5.0
  date: '2026-09-15'
  title: 100% Native Vulkan Hardware Pipeline & Fail-Fast Architecture
  type: Historical Release
  changes:
  - 'Bionic Native Vulkan Direct Binding: Permanently eliminated Termux Mesa llvmpipe CPU software emulator trap by dynamically binding /system/lib64/libvulkan.so, activating 100% native Qualcomm Adreno (KGSL) and ARM Mali GPU compute pipelines.'
  - 'HiFi-GAN 32MB Memory Ceiling Resolution: Overcame mobile GPU 32MB maxBufferSize allocation limit in MeloTTS HiFi-GAN via temporal window slicing (T_chunk <= 819), preventing VK_ERROR_OUT_OF_DEVICE_MEMORY and driver TDR resets.'
  - 'Piper VITS On-Chip SRAM Tiling: Integrated on-chip SRAM tiling architecture eliminating kernel crashes across all Exynos and Snapdragon hardware.'
  - 'Strict Zero-Silent-Fallback & Anti-Deception: Completely excised CPU fallback heuristics and silent exception swallowing; raises explicit RuntimeError on hardware or memory faults.'
  - 'Next-Gen MZ Neural Triad: Added first-class native architectures for Kokoro-82M (INT8 StyleTTS2), MeloTTS Universal Bilingual, and Supertonic 3 Flow Matching across 31 languages.'
  - 'Empirical Fleet Verification: Ground-truth validated on Galaxy S22 (Adreno 730: 2,750ms, RTF 0.88x), S21 (Mali-G78: 560ms, RTF 0.18x), S20 (Mali-G77: 750ms, RTF 0.24x), and S25 (Adreno 830: 380ms, RTF 0.12x).'
- version: v1.4.4
  date: '2026-09-14'
  title: Multilingual Neural Orchestrator & Zero-Config Ergonomics
  type: Stable Release
  changes:
  - Implemented MultilingualNeuralEngine supporting dynamic cross-language code-switching across 9 languages (ko, en, ja, zh, hi, ru, es, fr, de).
  - Built SherpaResidentManager for native in-memory C-API residency with sub-0.18x RTF and zero subprocess startup lag.
  - Promoted speech synthesis to default top-level subcommand, accepting positional text without '-t' or '-e multilingual'.
  - Integrated universal Unicode script classifier covering Hangul, Latin, Devanagari, Cyrillic, CJK, and Arabic scripts.
  - Enhanced 1-click installer with lightweight default models (ko+en) and on-demand provisioning (--models <lang> / all).
  - Hardened defensive path handling with Path.expanduser() across audio exports and CLI arguments.
- version: v1.3.0
  date: '2026-09-05'
  title: Production 4-Tier Synthesizer & Studio Vulkan GPU Acceleration
  type: Stable Release
  changes:
  - Implemented Tier 4 Pure Vulkan GPU Neural Engine (sherpa-ncnn-offline-tts-vulkan) with zero CPU fallback.
  - Integrated studio-grade reference model (vits-piper-en_US-lessac-high-fp16, 22.05kHz 16-bit PCM).
  - Implemented 1-click automated provisioning toolchain (termux-tts install --tier high/medium) downloading ARM64 native binaries from GitHub Release.
  - Resolved ARM Mali-G68 subgroup size 16 shader integer truncation and Adreno 830 pipeline cache crashes.
  - Achieved empirical RTF 0.264x on Galaxy S25 Adreno 830 and RTF 1.146x on Galaxy A35 Mali-G68.
  - Unified cross-platform CLI, Python SDK, and Node.js / TypeScript runtime bindings.
- version: v1.1.5
  date: '2026-09-04'
  title: Subprocess Isolation & Conversational Tag Expansion
  type: Archive Release
  changes:
  - Implemented subprocess IPC audio playback isolation.
  - Added expressive conversational token handling.
  - Stabilized Termux-API native bridge integration.
readme_content: "# Termux-TTS\n\n[![PyPI](https://img.shields.io/pypi/v/termux-tts.svg?style=flat-square&color=0369a1)](https://pypi.org/project/termux-tts/)\n[![Python](https://img.shields.io/pypi/pyversions/termux-tts.svg?style=flat-square)](https://pypi.org/project/termux-tts/)\n[![npm](https://img.shields.io/npm/v/termux-tts.svg?style=flat-square&color=b91c1c)](https://www.npmjs.com/package/termux-tts)\n[![License](https://img.shields.io/badge/License-Apache_2.0-004499.svg?style=flat-square)](https://github.com/uno-km/termux-tts)\n\n> Production-Grade 4-Tier On-Device Speech Synthesis Framework (Multilingual Neural Orchestrator, Zero-Dependency DSP Formant & C++ Acceleration)\n\n---\n\n## What's New in v1.7.0 — Tier 5 SOTA Neural Pipelines & Zero-Shot Voice Cloning\n\n- Integrated Tier 5 SOTA ONNX neural synthesis pipelines: CosyVoice 2, F5-TTS, and ChatTTS INT8.\n- Enabled on-device zero-shot voice cloning and conversational prosody control.\n- Eliminated legacy sinusoidal fallback\
  \ stubs in favor of strict fail-fast error reporting.\n- Added speaker profile and acoustic adaptor CLI commands.\n- Unified GPU neural vocoder dispatch through ameva-runtime HAL.\n\n---\n\n## Architecture & Overview\n\nTermux-TTS is an enterprise-grade, on-device text-to-speech framework optimized for mobile edge hardware and Android Termux environments. Built to eliminate heavy dependency stacks and fragile driver behaviors, it features a resilient 4-Tier architecture:\n\n- **Multilingual Neural Orchestrator**: Dynamic cross-language code-switching mesh covering 9 official languages (Korean, English, Japanese, Chinese, Hindi, Russian, Spanish, French, German) with Unicode script tokenization and 50ms context-aware silence padding.\n- **Resident C-API In-Memory Engine**: Direct C-API memory residency with `SherpaResidentManager` achieving sub-0.18x real-time factor with ARM NEON SIMD acceleration and zero subprocess lag.\n- **Tier 1: Zero-Dependency Parametric DSP Formant Vocoder**: 0MB\
  \ disk footprint, Rosenberg glottal pulse formulation, and 5-band biquad formant filters providing deterministic speech synthesis in under 50 milliseconds (RTF 0.013x).\n- **Tier 2: Android System Native Voice Bridge**: Direct IPC integration to physical Samsung and Google speech engines via the Termux-API service layer.\n- **Tier 3: Subprocess-Isolated Sherpa C++ CPU Engine**: Subprocess-isolated VITS acoustic modeling on ARM64 NEON with memory leak protection.\n- **Tier 4: Pure Vulkan GPU Hardware Neural Engine**: High-performance GPU tensor synthesis via precompiled native C++ binaries (`sherpa-ncnn-offline-tts-vulkan`) running high-resolution studio models (`vits-piper-en_US-lessac-high-fp16`) with zero silent CPU fallback.\n\n---\n\n## Empirical Hardware Benchmarks (Physical Devices)\n\nMeasurements gathered on physical Android 16 hardware running Termux ARM64:\n\n| Target Device | Hardware Architecture | Synthesis Engine | Model Profile | Audio Length | Synthesis Time | Real-Time\
  \ Factor (RTF) | Status |\n| :--- | :--- | :--- | :--- | :--- | :---: | :---: | :---: |\n| **Galaxy A53** | Exynos 1280 / ARM64 NEON | Multilingual Neural C-API | `KSS + Lessac` (Bilingual) | 10.50 s | **1.82 s** | **0.173x** | Validated (5.78x RT) |\n| **Galaxy S25** | Snapdragon 8 Elite / Adreno 830 | Vulkan GPU Neural | `lessac-high-fp16` | 6.70 s | **6.65 s** | **0.993x** | Validated |\n| **Galaxy S25** | Snapdragon 8 Elite / Adreno 830 | Vulkan GPU Neural | `lessac-medium` | 4.59 s | **1.21 s** | **0.264x** | Validated (3.79x RT) |\n| **Galaxy A35** | Exynos 1380 / Mali-G68 MP5 | Vulkan GPU Neural | `lessac-medium` | 4.52 s | **5.18 s** | **1.146x** | Validated |\n| **ARM64 CPU** | Cortex-A78 / A55 | Parametric DSP | 5-Band Biquad | 4.15 s | **0.054 s** | **0.0130x** | Validated (76x RT) |\n\n---\n\n## Installation & Automated Provisioning\n\n### 1. Package Installation\n```bash\n# Python SDK & CLI\npip install termux-tts\n\n# Node.js / TypeScript\nnpm install termux-tts\n```\n\n\
  ### 2. Automated Model Provisioning\nAutomate downloading and linking precompiled models to the official immutable path (`/data/data/com.termux/files/home/models/tts/`):\n```bash\n# Default lightweight installation (Korean KSS + English Lessac)\ntermux-tts install\n\n# On-demand provision specific language models:\ntermux-tts install --models hi    # Hindi (Piper Swara)\ntermux-tts install --models ja    # Japanese (Piper Hina)\ntermux-tts install --models ru    # Russian (Piper Dmitri)\ntermux-tts install --models zh    # Chinese (AISHELL3)\ntermux-tts install --models all   # All 9 official languages\n\n# Provision Studio Vulkan GPU engine:\ntermux-tts install --tier high\n```\n\n---\n\n## Quickstart\n\n### Global Command-Line Interface (Zero-Config)\n```bash\n# 1. Zero-config synthesis with physical speaker playback\ntermux-tts \"Hello 방가방가 나는 parrot 이라고 해.\" -o ~/out.wav --play\n\n# 2. Flag-based syntax\ntermux-tts -t \"Multilingual neural speech synthesis on device.\" --play\n\n#\
  \ 3. Force language pinning\ntermux-tts -l en -t \"Pure English text output.\" --play\ntermux-tts -l ko -t \"한국어 단독 신경망 음성 합성.\" --play\n\n# 4. Instant DSP Formant synthesis (0MB footprint)\ntermux-tts synth -e dsp -t \"Zero dependency DSP synthesis.\" -o dsp.wav\n\n# 5. Direct Android system native speaker broadcast\ntermux-tts speak -t \"Hardware speaker broadcast via Android service.\"\n\n# 6. Hardware diagnostics\ntermux-tts doctor\n```\n\n### Python SDK\n```python\nimport termux_tts as tts\n\n# 1. Zero-Config Multilingual Neural Synthesis (Korean + English Code-Switching)\nwith tts.load() as engine:\n    result = engine.synthesize(\n        \"Hello 방가방가 키키키키 나는 parrot 이라고 해.\",\n        output=\"multilingual.wav\"\n    )\n    print(f\"Generated {result.duration_sec:.2f}s in {result.elapsed_ms:.1f}ms (RTF: {result.rtf:.4f}x)\")\n\n# 2. Pure Vulkan GPU Neural Synthesis (Studio Tier)\nwith tts.load(engine=\"vulkan\", model_tier=\"high\") as engine:\n    result = engine.synthesize(\"\
  Pure Vulkan neural execution on mobile.\", output=\"speech.wav\")\n    print(f\"Synthesized in {result.elapsed_ms:.1f}ms (RTF: {result.rtf:.4f}x)\")\n\n# 3. Zero-Dependency DSP Formant Synthesis\nwith tts.load(engine=\"dsp\", preset=\"balanced\") as engine:\n    result = engine.synthesize(\"Instant speech without model downloads.\", output=\"dsp.wav\")\n    print(f\"DSP Latency: {result.elapsed_ms:.1f}ms\")\n```\n\n### Node.js / TypeScript\n```typescript\nimport * as tts from 'termux-tts';\n\nasync function main() {\n  const engine = tts.load({ engine: 'vulkan', tier: 'high' });\n  const res = await engine.synthesize(\"High performance speech synthesis.\", { output: \"speech.wav\" });\n  console.log(`Synthesized in ${res.elapsedMs}ms`);\n}\nmain();\n```\n\n---\n\n## Official Documentation & Benchmarks\n- [Official Architecture & API Reference](https://uno-km.vercel.app/lib/tts/)\n- [Ecosystem Metrics & Registry Stats](https://uno-km.vercel.app/foundation/metrics)\n- [AMEVA Open-Source\
  \ Foundation Portal](https://uno-km.vercel.app/foundation/index.html)\n\n---\n\n## License\nLicensed under the Apache-2.0 License. Copyright (c) 2026 Eunho Kim ([@uno-km](https://github.com/uno-km)).\n"
readme_pypi_content: "# Termux-TTS (Python)\n\n[![PyPI](https://img.shields.io/pypi/v/termux-tts.svg?style=flat-square&color=0369a1)](https://pypi.org/project/termux-tts/)\n[![Python](https://img.shields.io/pypi/pyversions/termux-tts.svg?style=flat-square)](https://pypi.org/project/termux-tts/)\n[![License](https://img.shields.io/badge/License-Apache_2.0-004499.svg?style=flat-square)](https://github.com/uno-km/termux-tts)\n\n> Production-Grade 4-Tier On-Device Speech Synthesis Framework for Mobile & Edge (Zero-Dependency DSP Formant, C++ Vulkan GPU Neural Engine & Android Native Voice Bridge)\n\n## Installation\n\n```bash\npip install termux-tts\n```\n\n### 1-Click Automated Engine Provisioning\n```bash\ntermux-tts install --tier high\n```\n\n## Quickstart\n\n```python\nimport termux_tts as tts\n\n# 1. Studio Vulkan GPU Neural Engine\nwith tts.load(engine=\"vulkan\", model_tier=\"high\") as engine:\n    result = engine.synthesize(\"Neural speech synthesis on mobile GPU.\", output=\"speech.wav\"\
  )\n    print(f\"Elapsed: {result.elapsed_ms:.1f}ms (RTF: {result.rtf:.4f}x)\")\n\n# 2. Zero-Dependency DSP Formant Mode\nwith tts.load(engine=\"dsp\", preset=\"balanced\") as engine:\n    result = engine.synthesize(\"Instant speech generation.\", output=\"dsp.wav\")\n    print(f\"DSP Latency: {result.elapsed_ms:.1f}ms\")\n\n# 3. Direct Android Native Speaker Output\nwith tts.load(engine=\"native\", language=\"en\") as engine:\n    engine.speak(\"Direct hardware speaker output.\")\n```\n\n## Benchmarks (Physical Devices)\n\n| Target Device | Hardware Architecture | Synthesis Engine | Real-Time Factor (RTF) | Status |\n| :--- | :--- | :--- | :---: | :---: |\n| **Galaxy S25** | Snapdragon 8 Elite / Adreno 830 | Vulkan GPU (`lessac-high-fp16`) | **0.993x** | Validated |\n| **Galaxy S25** | Snapdragon 8 Elite / Adreno 830 | Vulkan GPU (`lessac-medium`) | **0.264x** | Validated |\n| **Galaxy A35** | Exynos 1380 / Mali-G68 MP5 | Vulkan GPU (`lessac-medium`) | **1.146x** | Validated |\n| **ARM64\
  \ CPU** | All Core Profiles | Parametric DSP Formant | **0.0130x** | Validated |\n\n## Documentation\n- [Official Documentation & API Reference](https://uno-km.vercel.app/lib/tts/)\n- [GitHub Repository](https://github.com/uno-km/termux-tts)\n\n## License\nApache-2.0 License. Copyright (c) 2026 Eunho Kim (@uno-km).\n\n\n## What's New in v1.7.0 — Tier 5 SOTA Neural Pipelines & Zero-Shot Voice Cloning\n\n- Integrated Tier 5 SOTA ONNX neural synthesis pipelines: CosyVoice 2, F5-TTS, and ChatTTS INT8.\n- Enabled on-device zero-shot voice cloning and conversational prosody control.\n- Eliminated legacy sinusoidal fallback stubs in favor of strict fail-fast error reporting.\n- Added speaker profile and acoustic adaptor CLI commands.\n- Unified GPU neural vocoder dispatch through ameva-runtime HAL.\n"
readme_npm_content: "# Termux-TTS (Node.js & TypeScript)\n\n[![npm](https://img.shields.io/npm/v/termux-tts.svg?style=flat-square&color=b91c1c)](https://www.npmjs.com/package/termux-tts)\n[![License](https://img.shields.io/badge/License-Apache_2.0-004499.svg?style=flat-square)](https://github.com/uno-km/termux-tts)\n\n> Production-Grade 4-Tier On-Device Speech Synthesis Framework for Mobile & Edge (Zero-Dependency DSP Formant, C++ Vulkan GPU Neural Engine & Android Native Voice Bridge)\n\n## Installation\n\n```bash\nnpm install termux-tts\n```\n\n## Quickstart\n\n```typescript\nimport * as tts from 'termux-tts';\n\nasync function main() {\n  const engine = tts.load({ engine: 'vulkan', tier: 'high' });\n  const res = await engine.synthesize(\"High performance speech synthesis on mobile.\", { output: \"output.wav\" });\n  console.log(`Synthesized: ${res.durationSec}s in ${res.elapsedMs}ms (RTF: ${res.rtf}x)`);\n}\nmain();\n```\n\n## Documentation\n- [Official Documentation & API Reference](https://uno-km.vercel.app/lib/tts/)\n\
  - [GitHub Repository](https://github.com/uno-km/termux-tts)\n\n## License\nApache-2.0 License. Copyright (c) 2026 Eunho Kim (@uno-km).\n\n\n## What's New in v1.7.0 — Tier 5 SOTA Neural Pipelines & Zero-Shot Voice Cloning\n\n- Integrated Tier 5 SOTA ONNX neural synthesis pipelines: CosyVoice 2, F5-TTS, and ChatTTS INT8.\n- Enabled on-device zero-shot voice cloning and conversational prosody control.\n- Eliminated legacy sinusoidal fallback stubs in favor of strict fail-fast error reporting.\n- Added speaker profile and acoustic adaptor CLI commands.\n- Unified GPU neural vocoder dispatch through ameva-runtime HAL.\n"
