api_reference:
- symbol: termux_tts.load(engine='auto'|'vulkan'|'sherpa'|'dsp'|'native', model_tier='high'|'medium', preset='balanced')
  description: Factory initializer returning the configured synthesis engine context with resource finalization.
- symbol: 'engine.synthesize(text: str, output: str = None, speed: float = 1.0, preset: str = None) -> SynthesisResult'
  description: Executes phonetic tokenization, neural/DSP acoustic modeling, and writes 16-bit PCM WAV audio.
- symbol: 'engine.speak(text: str, stream: str = ''MUSIC'') -> NativeResult'
  description: Routes speech synthesis directly to the physical device speakers via Android system native services.
- symbol: termux_tts.run_installation(tier='high'|'medium', force=False) -> bool
  description: Automated provisioning toolchain downloading native C++ binaries from GitHub Releases and HuggingFace weights.
- symbol: termux_tts.doctor() -> DiagnosticReport
  description: Runs rigorous 12-stage hardware diagnostics verifying Vulkan instance, GPU compute queues, and memory buffers.
installation_body: '<h3>Standard Package Installation</h3>

  <p>Install the core Python or Node.js package directly from standard package repositories:</p>

  <pre><code># Python (PyPI)

  pip install termux-tts


  # Node.js / TypeScript (NPM)

  npm install termux-tts</code></pre>


  <h3>Prerequisites on Android Termux</h3>

  <p>Ensure that the required system packages are installed in your Termux environment:</p>

  <pre><code>pkg update && pkg install -y termux-api pulseaudio sox clang</code></pre>


  <h3>1-Click Automated Engine Provisioning</h3>

  <p>To enable Tier 4 Vulkan GPU neural speech synthesis without manual compilation or model downloading, run the built-in installer:</p>

  <pre><code># Install High-Resolution Studio Tier (vits-piper-en_US-lessac-high-fp16, 22.05kHz)

  termux-tts install --tier high


  # Or install Medium Compact Tier (vits-piper-en_US-lessac-medium)

  termux-tts install --tier medium</code></pre>

  <p>The provisioning script downloads the precompiled native ARM64 C++ binary (<code>sherpa-ncnn-offline-tts-vulkan</code>) from the official GitHub Release and verifies execution via an immediate self-test.</p>

  '
quickstart_body: "<h3>Command-Line Interface (CLI) Recipes</h3>\n<pre><code># 1. High-Resolution Studio Neural Synthesis with Speaker Playback\ntermux-tts synth -e vulkan --tier high -t \"Operating at full hardware capacity.\" -o speech.wav --play\n\n# 2. Instant Zero-Dependency DSP Formant Synthesis\ntermux-tts synth -e dsp -p ultra -t \"Zero dependency parametric speech synthesis.\" -o dsp.wav\n\n# 3. Direct Android Hardware Speaker Broadcast\ntermux-tts speak -t \"System notification broadcast.\" -l en\n\n# 4. Hardware and Environment Diagnostics\ntermux-tts doctor</code></pre>\n\n<h3>Python SDK Canon</h3>\n<pre><code>import termux_tts as tts\n\n# Initialize pure Vulkan GPU neural synthesis engine\nwith tts.load(engine=\"vulkan\", model_tier=\"high\") as engine:\n    res = engine.synthesize(\"Validating deterministic tensor execution.\", output=\"out.wav\")\n    print(f\"Elapsed: {res.elapsed_ms:.1f}ms | RTF: {res.rtf:.4f}x\")</code></pre>\n"
api_body: "<h3>Factory Gateway</h3>\n<table class=\"data-table\">\n  <thead>\n    <tr><th>Symbol</th><th>Signature</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><code>termux_tts.load</code></td>\n      <td><code>(engine: str = 'auto', model_tier: str = 'high', preset: str = 'balanced', language: str = 'en')</code></td>\n      <td>Initializes and returns the unified TTS engine instance. Supports context manager pattern.</td>\n    </tr>\n    <tr>\n      <td><code>termux_tts.run_installation</code></td>\n      <td><code>(tier: str = 'high', force: bool = False) -> bool</code></td>\n      <td>1-click provisioning tool downloading native ARM64 C++ binaries and model weights.</td>\n    </tr>\n    <tr>\n      <td><code>termux_tts.doctor</code></td>\n      <td><code>() -> DiagnosticReport</code></td>\n      <td>Executes comprehensive 12-stage Vulkan and system diagnostics.</td>\n    </tr>\n  </tbody>\n</table>\n\n<h3>Engine Methods</h3>\n<table class=\"data-table\">\n\
  \  <thead>\n    <tr><th>Method</th><th>Parameters</th><th>Return Type</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td><code>synthesize</code></td>\n      <td><code>(text: str, output: str = None, speed: float = 1.0, preset: str = None)</code></td>\n      <td><code>SynthesisResult</code></td>\n      <td>Synthesizes text into 16-bit linear PCM WAV audio.</td>\n    </tr>\n    <tr>\n      <td><code>speak</code></td>\n      <td><code>(text: str, stream: str = 'MUSIC')</code></td>\n      <td><code>NativeResult</code></td>\n      <td>Transmits speech to the device speaker via Android native TTS bridge.</td>\n    </tr>\n  </tbody>\n</table>\n"
